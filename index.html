<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>野澤昂汰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<script>
  const PROFILE = {
    nameJa: "野澤昂汰",
    nameEn: "Nozawa Kota",
    handle: "@neru8376",
  };
  const LINKS = [
    { label:"公認 井口智明チャンネル", sub:"令和の虎 公認クリップ",   url:"https://youtube.com/channel/UC6-OB72njfEpepZqeGRE69A?si=v36pZFlOIGTG3FzS", tag:"YouTube" },
    { label:"雑学チャンネル",          sub:"知って得する雑学 Shorts", url:"https://youtube.com/channel/UC8IqCuIDkJu7RlMymu_Q-0A?si=A4zqGmRpch82aahy",  tag:"YouTube" },
    { label:"X（Twitter）",           sub:"@neru8376",              url:"https://x.com/neru8376?s=21",                                                  tag:"X"       },
    // 追加: { label:"名前", sub:"説明", url:"https://...", tag:"YouTube" },
  ];
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

:root{
  --cream:  #faf7f2;
  --warm:   #f2ece0;
  --ink:    #1c1a17;
  --mid:    #6b6560;
  --faint:  #aaa49c;
  --rule:   #e0d8cc;
  --gold:   #8a7a6a;
}

body{
  background: var(--cream);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ページ全体のフェードイン ── */
body { opacity: 0; animation: bodyFade .6s ease .1s forwards; }
@keyframes bodyFade { to { opacity: 1; } }

/* ── 上部の細い金線 ── */
.top-rule {
  width: 100%;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  opacity: 0;
  animation: fadeIn .8s ease .4s forwards;
}

/* ── LAYOUT ── */
.page {
  max-width: 520px;
  margin: 0 auto;
  padding: 0 32px 100px;
}

/* ── HERO ── */
.hero {
  padding: 72px 0 64px;
  text-align: center;
  opacity: 0;
  animation: riseIn 1s cubic-bezier(.16,1,.3,1) .2s forwards;
}

.pre-name {
  font-family: 'DM Sans', sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 20px;
}

.name-ja {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  font-size: clamp(38px, 9vw, 58px);
  letter-spacing: 0.08em;
  color: var(--ink);
  line-height: 1;
  margin-bottom: 14px;
}

.name-en {
  font-family: 'DM Sans', sans-serif;
  font-style: normal;
  font-weight: 300;
  font-size: 16px;
  letter-spacing: 0.16em;
  color: var(--mid);
  margin-bottom: 28px;
  text-transform: uppercase;
}

.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 28px;
}
.ornament-line { display: none; }
.ornament-diamond {
  width: 5px; height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
}

.handle {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--faint);
}

/* ── LINKS ── */
.links {
  padding-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 24px;
  background: #fff;
  border-radius: 20px;
  text-decoration: none;
  color: var(--ink);
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,.05);

  opacity: 0;
  transform: translateY(22px);
  transition: opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1),
              box-shadow .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}
.link-item.in { opacity: 1; transform: translateY(0); }
.link-item:hover {
  box-shadow: 0 8px 32px rgba(0,0,0,.10);
  transform: translateY(-3px);
}

/* hover: warm background wash */
.link-item::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--warm);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform .45s cubic-bezier(.16,1,.3,1);
  z-index: 0;
}
.link-item:hover::before { transform: scaleY(1); }
.link-item > * { position: relative; z-index: 1; }

.item-left { flex: 1; }

.item-tag {
  font-family: 'DM Sans', sans-serif;
  font-style: normal;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 6px;
  transition: letter-spacing .35s ease;
}
.link-item:hover .item-tag { letter-spacing: 0.24em; }

.item-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--ink);
  margin-bottom: 5px;
  line-height: 1.4;
}

.item-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--mid);
  line-height: 1.4;
}

.item-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  padding-left: 20px;
  flex-shrink: 0;
}

.item-arrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: var(--faint);
  line-height: 1;
  transition: color .3s, transform .4s cubic-bezier(.34,1.56,.64,1);
}
.link-item:hover .item-arrow {
  color: var(--gold);
  transform: translateX(6px);
}

/* ── FOOTER ── */
.footer {
  margin-top: 64px;
  text-align: center;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .7s ease, transform .7s ease;
}
.footer.in { opacity: 1; transform: translateY(0); }

.footer-ornament { display: none; }

.footer-copy {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.16em;
  color: var(--faint);
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>



<!-- top rule removed -->

<div class="page">
  <header class="hero">
    <div class="pre-name">Links</div>
    <div class="name-ja" id="nJa"></div>
    <div class="name-en" id="nEn"></div>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>
    </div>
    <div class="handle" id="handle"></div>
  </header>

  <div class="links" id="links"></div>
  <footer class="footer" id="foot"></footer>
</div>

<script>
document.getElementById('nJa').textContent    = PROFILE.nameJa;
document.getElementById('nEn').textContent    = PROFILE.nameEn;
document.getElementById('handle').textContent = PROFILE.handle;

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('in');
}), { threshold: .1 });

const wrap = document.getElementById('links');
LINKS.forEach((l, i) => {
  const a = document.createElement('a');
  a.className = 'link-item';
  a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.style.transitionDelay = `${i * .1}s`;
  a.innerHTML = `
    <div class="item-left">
      <div class="item-tag">${l.tag}</div>
      <div class="item-label">${l.label}</div>
      <div class="item-sub">${l.sub}</div>
    </div>
    <div class="item-right">
      <div class="item-arrow">→</div>
    </div>
  `;
  a.addEventListener('transitionend', () => a.style.transitionDelay = '0s', { once: true });
  wrap.appendChild(a);
  io.observe(a);
});

const foot = document.getElementById('foot');
foot.innerHTML = `
  <div class="footer-ornament">
    <div class="footer-ornament-line"></div>
    <div class="footer-ornament-diamond"></div>
    <div class="footer-ornament-line"></div>
  </div>
  <div class="footer-copy">© 2026 ${PROFILE.nameJa}</div>
`;
io.observe(foot);
</script>
</body>
</html>
