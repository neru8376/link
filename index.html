<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="description" content="野澤昂汰 / Nozawa Kota official link-in-bio page.">
  <title>野澤昂汰 | Nozawa Kota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f7;
      --paper-warm: #ffffff;
      --ink: #1d1d1f;
      --ink-muted: #6e6e73;
      --ink-soft: rgba(29, 29, 31, 0.08);
      --gold: #bf9b5f;
      --gold-bright: #9b7432;
      --gold-soft: rgba(191, 155, 95, 0.16);
      --gold-border: rgba(191, 155, 95, 0.26);
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-bg-strong: rgba(255, 255, 255, 0.96);
      --shadow: rgba(0, 0, 0, 0.1);
      --page-pad: clamp(22px, 5vw, 72px);
      --max-width: 900px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.9), transparent 26%),
        linear-gradient(180deg, #ffffff 0%, var(--paper) 58%, #eeeeef 100%);
      font-family: "Space Grotesk", "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(rgba(29, 29, 31, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 29, 31, 0.024) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(to bottom, transparent, black 20%, black 74%, transparent);
      opacity: 0.36;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.42), transparent 44%);
      opacity: 0.5;
    }

    a {
      color: inherit;
    }

    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 3;
      display: grid;
      min-height: 100svh;
      grid-template-rows: 1fr auto;
      padding: var(--page-pad);
    }

    .scene {
      display: grid;
      width: min(100%, var(--max-width));
      margin: 0 auto;
      align-content: center;
      gap: clamp(34px, 6vw, 62px);
      perspective: 1100px;
    }

    .profile {
      position: relative;
      transform-style: preserve-3d;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 clamp(14px, 2vw, 20px);
      color: var(--gold);
      font-size: clamp(0.82rem, 1.2vw, 0.95rem);
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeRise 0.8s 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .eyebrow::before {
      width: 26px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .title {
      margin: 0;
      line-height: 0.98;
      font-weight: 900;
    }

    .title-line {
      display: block;
      width: fit-content;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
      transform-style: preserve-3d;
      animation: titleClip 1.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .title-line + .title-line {
      margin-top: clamp(8px, 1.4vw, 14px);
      animation-delay: 0.18s;
    }

    .title-line > span {
      display: inline-block;
      transform: translateY(112%) rotateX(48deg);
      transform-origin: left bottom;
      animation: titleRise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .title-line + .title-line > span {
      animation-delay: 0.18s;
    }

    .title-jp {
      font-family: "Noto Sans JP", "Space Grotesk", sans-serif;
      font-size: clamp(3.1rem, 11vw, 7.6rem);
    }

    .title-en {
      color: rgba(29, 29, 31, 0.26);
      font-size: clamp(2rem, 6.4vw, 4.9rem);
      -webkit-text-stroke: 0;
      text-shadow: none;
    }

    .profile-line {
      width: min(520px, 78vw);
      height: 1px;
      margin-top: clamp(24px, 4vw, 34px);
      overflow: hidden;
      background: rgba(23, 19, 13, 0.1);
      opacity: 0;
      animation: fadeIn 0.8s 0.78s ease forwards;
    }

    .profile-line::before {
      display: block;
      width: 42%;
      height: 100%;
      content: "";
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      animation: lineTravel 3.2s 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .link-stage {
      display: grid;
      gap: clamp(14px, 2vw, 18px);
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .card-entry {
      opacity: 0;
      transform: translate3d(0, 34px, -120px) rotateX(14deg) scale(0.96);
      animation: cardEntry 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(0.88s + (var(--i) * 0.14s));
      transform-style: preserve-3d;
    }

    .card-float {
      transform-style: preserve-3d;
      animation: cardFloat var(--float-duration, 8.5s) ease-in-out infinite;
      animation-delay: calc(var(--i) * -0.8s);
    }

    .link-card {
      --rx: 0deg;
      --ry: 0deg;
      --lift: 0px;
      position: relative;
      display: block;
      min-height: clamp(104px, 12vw, 124px);
      text-decoration: none;
      outline: none;
      transform: translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      transition: transform 240ms cubic-bezier(0.2, 0, 0.2, 1), filter 240ms ease;
      will-change: transform;
    }

    .link-card::before {
      position: absolute;
      inset: -1px;
      z-index: -1;
      content: "";
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(191, 155, 95, 0.44), rgba(255, 255, 255, 0.1), rgba(191, 155, 95, 0.18));
      opacity: 0.24;
      filter: blur(12px);
      transform: translateZ(-8px);
      transition: opacity 240ms ease, filter 240ms ease;
    }

    .card-entry.is-hovered .link-card,
    .card-entry:focus-within .link-card,
    .link-card:focus-visible {
      --lift: -6px;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.12));
    }

    .card-entry.is-hovered .link-card::before,
    .card-entry:focus-within .link-card::before,
    .link-card:focus-visible::before {
      opacity: 0.48;
      filter: blur(16px);
    }
